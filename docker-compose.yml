services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: ncc_ems_dev_moodle_db
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      RESTORE_FROM_BACKUP: ${RESTORE_FROM_BACKUP:-false}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
      - ./backup:/backup:ro
    networks:
      - moodle_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # PHP-FPM with Moodle
  moodle:
    build:
      context: ./docker/php
      args:
        MOODLE_VERSION: ${MOODLE_VERSION:-4.5}
        PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
        PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-256M}
        PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-256M}
        PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
        TIMEZONE: ${TIMEZONE:-UTC}
    container_name: ncc_ems_dev_moodle_app
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ENABLE_SSL: ${ENABLE_SSL:-true}
      RESTORE_FROM_BACKUP: ${RESTORE_FROM_BACKUP:-false}
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
      MOODLE_SITE_FULLNAME: ${MOODLE_SITE_FULLNAME:-My Moodle Site}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME:-Moodle}
      TIMEZONE: ${TIMEZONE:-UTC}
    volumes:
      - moodle_data:/var/www/html
      - moodledata:/var/www/moodledata
      - ./backup:/backup:ro
    networks:
      - moodle_network
    depends_on:
      db:
        condition: service_healthy

  # Nginx Web Server (internal, exposed to host nginx via port)
  nginx:
    image: nginx:alpine
    container_name: ncc_ems_dev_moodle_nginx
    restart: unless-stopped
    ports:
      - "${MOODLE_PORT:-8080}:80"
    volumes:
      - moodle_data:/var/www/html:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - moodle_network
    depends_on:
      - moodle

  # Cron for Moodle scheduled tasks
  cron:
    build:
      context: ./docker/php
      args:
        MOODLE_VERSION: ${MOODLE_VERSION:-4.5}
        PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
        PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-256M}
        PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-256M}
        PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
        TIMEZONE: ${TIMEZONE:-UTC}
    container_name: ncc_ems_dev_moodle_cron
    restart: unless-stopped
    entrypoint: /usr/local/bin/cron-entrypoint.sh
    environment:
      DOMAIN: ${DOMAIN}
      ENABLE_SSL: ${ENABLE_SSL:-true}
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TIMEZONE: ${TIMEZONE:-UTC}
    volumes:
      - moodle_data:/var/www/html
      - moodledata:/var/www/moodledata
    networks:
      - moodle_network
    depends_on:
      db:
        condition: service_healthy

  # One-shot backup: docker compose run --rm backup
  # Writes ./backup/moodle-backup-<timestamp>.tar.gz and exits.
  backup:
    image: mysql:8.0
    container_name: ncc_ems_dev_moodle_backup
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["bash", "/scripts/backup.sh"]
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - ./docker/backup/backup.sh:/scripts/backup.sh:ro
      - moodle_data:/source/moodle:ro
      - moodledata:/source/moodledata:ro
      - ./backup:/backup
    networks:
      - moodle_network
    depends_on:
      db:
        condition: service_healthy

  # One-shot restore: docker compose run --rm restore
  # Reads ./restore and OVERWRITES database, Moodle code and moodledata.
  # Stop moodle/cron/nginx first (scripts/restore.sh does this).
  restore:
    image: mysql:8.0
    container_name: ncc_ems_dev_moodle_restore
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["bash", "/scripts/restore.sh"]
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RESTORE_FILE: ${RESTORE_FILE:-}
      RESTORE_KEEP_CONFIG: ${RESTORE_KEEP_CONFIG:-false}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - ./docker/backup/restore.sh:/scripts/restore.sh:ro
      - ./restore:/restore:ro
      - moodle_data:/target/moodle
      - moodledata:/target/moodledata
    networks:
      - moodle_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  moodle_data:
  moodledata:

networks:
  moodle_network:
    driver: bridge
